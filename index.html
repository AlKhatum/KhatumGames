<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Welcome to the Teyvat</title>
<style>
  :root {
    --accent: #8fd0d8;
    --accent-dim: #3f7880;
    --panel: rgba(10, 16, 20, .92);
    --text: #d7e6e8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--text); overflow: hidden;
    font-family: "Segoe UI", Roboto, Arial, sans-serif; font-size: 13px; }
  button, input, select { font: inherit; color: inherit; }

  /* ---------- Карта ---------- */
  #viewport { position: fixed; inset: 0; overflow: hidden; touch-action: none; background: #565b5f; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
  #world > * { position: absolute; left: 0; top: 0; user-select: none; -webkit-user-drag: none; pointer-events: none; }
  #terr { opacity: 1; }
  #overlay { position: fixed; inset: 0; pointer-events: none; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--accent); font-size: 16px; pointer-events: none; }

  /* ---------- Окна ---------- */
  .win { position: fixed; z-index: 30; background: var(--panel); border: 1px solid var(--accent-dim); border-radius: 8px;
    box-shadow: 0 6px 24px rgba(0,0,0,.5); min-width: 200px; }
  .win-h { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px 6px 10px; cursor: move;
    color: var(--accent); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; font-size: 12px;
    border-bottom: 1px solid rgba(143,208,216,.15); user-select: none; touch-action: none; }
  .win-h button { background: none; border: 1px solid var(--accent-dim); color: var(--accent); border-radius: 4px; cursor: pointer;
    width: 22px; height: 20px; line-height: 1; padding: 0; }
  .win-b { padding: 8px 10px 10px; max-height: calc(100vh - 120px); overflow: auto; }
  .win.collapsed .win-b { display: none; }
  .win h4 { margin: 10px 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #7fa9ae; font-weight: 600; }
  .win h4:first-child { margin-top: 0; }

  .btn { background: #18232a; border: 1px solid #2d434a; border-radius: 5px; padding: 5px 8px; cursor: pointer; text-align: left; }
  .btn:hover { border-color: var(--accent-dim); }
  .btn.on { background: #1f3a40; border-color: var(--accent); color: #fff; }

  /* Инструменты */
  #tools { left: 12px; top: 12px; width: 222px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
  .grid4 .btn { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 5px 2px; font-size: 10px; text-align: center; }
  .opt { margin-top: 8px; }
  .opt label { display: flex; align-items: center; gap: 6px; margin-top: 6px; cursor: pointer; }
  .opt input[type=range] { width: 100%; }
  #cur-f { display: flex; align-items: center; gap: 6px; margin-top: 8px; padding: 5px 7px; border-radius: 5px; background: #121b20; }
  .sw { width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgba(255,255,255,.35); flex: none; }
  #tool-hint { margin-top: 8px; color: #8aa7ab; font-size: 11.5px; line-height: 1.35; }

  /* Легенда */
  #legend { right: 12px; top: 12px; width: 270px; }
  .frow { display: flex; align-items: center; gap: 6px; padding: 4px 5px; border-radius: 5px; border: 1px solid transparent; cursor: pointer; }
  .frow:hover { background: #121b20; }
  .frow.active { border-color: var(--accent); background: #142328; }
  .frow input[type=color] { width: 22px; height: 20px; padding: 0; border: 0; background: none; cursor: pointer; flex: none; }
  .frow input[type=text] { flex: 1; min-width: 0; background: transparent; border: 0; border-bottom: 1px dashed transparent; padding: 2px 0; }
  .frow input[type=text]:focus { outline: none; border-bottom-color: var(--accent-dim); }
  .fpct { color: #8aa7ab; font-size: 11px; min-width: 38px; text-align: right; }
  .fdel { background: none; border: 0; color: #a66; cursor: pointer; font-size: 15px; padding: 0 2px; }
  .srow { display: flex; align-items: center; gap: 8px; padding: 3px 5px; }
  .srow canvas { flex: none; }

  /* Всплывающее окно точки/дороги */
  #pop { position: fixed; z-index: 40; display: none; background: var(--panel); border: 1px solid var(--accent); border-radius: 8px; padding: 8px; width: 210px; }
  #pop input, #pop select { width: 100%; background: #121b20; border: 1px solid #2d434a; border-radius: 4px; padding: 4px 6px; margin-bottom: 6px; }
  #pop .row { display: flex; gap: 6px; }
  #pop .row .btn { flex: 1; text-align: center; }
  #pop .del { color: #f09a9a; }

  /* Масштаб */
  #controls { position: fixed; left: 12px; bottom: 12px; z-index: 20; display: flex; flex-direction: column; gap: 6px; }
  #controls button { width: 38px; height: 38px; font-size: 19px; line-height: 1; cursor: pointer;
    background: var(--panel); color: var(--accent); border: 1px solid var(--accent-dim); border-radius: 6px; }

  /* Музыка */
  #dock { position: fixed; right: 12px; bottom: 12px; z-index: 20; background: var(--panel);
    border: 1px solid var(--accent-dim); border-radius: 8px; padding: 6px; display: flex; flex-direction: column; gap: 6px; }
  #dock-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--accent); }
  #dock-head button { background: none; border: 1px solid var(--accent-dim); color: var(--accent); border-radius: 4px; cursor: pointer; font-size: 13px; padding: 1px 7px; }
  #dock iframe { display: block; width: 200px; height: 200px; border: 0; border-radius: 4px; }
  #dock-err { display: none; max-width: 200px; font-size: 12px; color: #e9a; }

  /* Заставка */
  #gate { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; background: radial-gradient(ellipse at center, #0b1418 0%, #000 70%); transition: opacity .6s; }
  #gate.hide { opacity: 0; pointer-events: none; }
  #gate h1 { margin: 0; font-size: clamp(32px, 6vw, 72px); color: var(--accent); text-align: center; text-shadow: 0 0 24px rgba(143,208,216,.35); }
  #enter { font-size: 20px; padding: 14px 36px; cursor: pointer; color: var(--accent); background: transparent;
    border: 2px solid var(--accent); border-radius: 6px; letter-spacing: .08em; text-transform: uppercase; transition: background .2s, color .2s; }
  #enter:hover { background: var(--accent); color: #000; }
  #gate small { color: #6a8; font-size: 13px; }
</style>
</head>
<body>

<div id="viewport">
  <div id="world">
    <img id="map" src="map.jpg" alt="Карта" draggable="false">
    <canvas id="terr"></canvas>
  </div>
</div>
<canvas id="overlay"></canvas>
<div id="loading">Загрузка карты…</div>

<!-- Инструменты -->
<div class="win" id="tools">
  <div class="win-h"><span>Инструменты</span><button class="min" title="Свернуть">–</button></div>
  <div class="win-b">
    <div class="grid2" id="toolbtns">
      <button class="btn" data-tool="pan">✋ Обзор</button>
      <button class="btn" data-tool="brush">🖌 Кисть</button>
      <button class="btn" data-tool="lasso">➰ Контур</button>
      <button class="btn" data-tool="fill">🪣 Заливка</button>
      <button class="btn" data-tool="erase">🧽 Ластик</button>
      <button class="btn" data-tool="point">📍 Точка</button>
      <button class="btn" data-tool="road">🛤 Дорога</button>
      <button class="btn" id="undo" title="Ctrl+Z">↶ Отменить</button>
    </div>

    <div class="opt" id="opt-brush">
      <div>Размер кисти: <span id="bsize-v"></span></div>
      <input type="range" id="bsize" min="4" max="160" value="40">
      <label><input type="checkbox" id="onlyfree"> не трогать чужие земли</label>
    </div>

    <div class="opt" id="opt-point">
      <div style="margin-bottom:5px">Тип точки:</div>
      <div class="grid4" id="ptypes"></div>
    </div>

    <div id="cur-f"><span>Держава:</span><span class="sw" id="cur-sw"></span><b id="cur-name"></b></div>
    <div id="tool-hint"></div>

    <h4 style="margin-top:12px">Данные</h4>
    <div class="grid2">
      <button class="btn" id="export">💾 Экспорт</button>
      <button class="btn" id="import">📂 Импорт</button>
      <button class="btn" id="clear-terr">🗑 Стереть земли</button>
      <button class="btn" id="clear-all">🗑 Стереть всё</button>
    </div>
    <input type="file" id="import-file" accept=".json,application/json" hidden>
  </div>
</div>

<!-- Легенда -->
<div class="win" id="legend">
  <div class="win-h"><span>Легенда</span><button class="min" title="Свернуть">–</button></div>
  <div class="win-b">
    <h4>Державы</h4>
    <div id="flist"></div>
    <button class="btn" id="fadd" style="margin-top:6px;width:100%;text-align:center">+ Добавить державу</button>
    <h4>Обозначения</h4>
    <div id="symlist"></div>
  </div>
</div>

<div id="pop"></div>

<div id="controls">
  <button id="zin" title="Приблизить">+</button>
  <button id="zout" title="Отдалить">−</button>
  <button id="zfit" title="Вся карта">⤢</button>
</div>

<div id="dock">
  <div id="dock-head"><span>♪ Музыка</span><button id="mute" title="Звук вкл/выкл">🔊</button></div>
  <div id="yt"></div>
  <div id="dock-err"></div>
</div>

<div id="gate">
  <h1>Welcome to the Teyvat</h1>
  <button id="enter">Войти</button>
  <small>сайт со звуком</small>
</div>

<script>
/* ======================= НАСТРОЙКИ ======================= */
const VIDEO_ID  = 'IisYtJGfVFU';  // id ролика YouTube
const START_SEC = 0;              // с какой секунды играть
const VOLUME    = 40;             // громкость 0–100

// 4 типа точек: id, подпись, форма значка, цвет
const PTYPES = [
  { id: 'capital', name: 'Столица',  shape: 'star',    color: '#f2c94c' },
  { id: 'city',    name: 'Город',    shape: 'circle',  color: '#ffffff' },
  { id: 'fort',    name: 'Крепость', shape: 'square',  color: '#e0604f' },
  { id: 'port',    name: 'Порт',     shape: 'diamond', color: '#5cc8f0' },
];
const DEFAULT_FACTIONS = [
  { id: 1, name: 'Держава 1', color: '#3b6fd6' },
  { id: 2, name: 'Держава 2', color: '#d64545' },
  { id: 3, name: 'Держава 3', color: '#3fae6a' },
  { id: 4, name: 'Держава 4', color: '#e0a63a' },
];
const TS = 3;            // 1 пиксель территорий = 3 пикселя карты
const FILL_A = 125;      // прозрачность заливки (0–255)
const STORE_KEY = 'teyvat-map-v1';
/* ========================================================= */

const $ = id => document.getElementById(id);
const vp = $('viewport'), world = $('world'), img = $('map');
const tcan = $('terr'), tctx = tcan.getContext('2d');
const ov = $('overlay'), octx = ov.getContext('2d');

let W = 0, H = 0, TW = 0, TH = 0;
let owner, land, vis, tImg, landTotal = 0;
let factions = [], points = [], roads = [];
let activeF = 1, tool = 'pan', ptype = 'city';
const view = { s: 1, tx: 0, ty: 0, min: .05, max: 2 };
const colorTab = new Uint8Array(256 * 6); // r,g,b, тёмные r,g,b
let mouse = { x: -999, y: -999, in: false };

/* ---------------- Утилиты ---------------- */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const hex2rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const toWorld = (x, y) => [(x - view.tx) / view.s, (y - view.ty) / view.s];
const toScreen = (x, y) => [x * view.s + view.tx, y * view.s + view.ty];
const newId = arr => arr.reduce((m, o) => Math.max(m, o.id), 0) + 1;
const fById = id => factions.find(f => f.id === id);
const pById = id => points.find(p => p.id === id);
const ptDef = id => PTYPES.find(t => t.id === id) || PTYPES[1];

function updateColors() {
  colorTab.fill(0);
  for (const f of factions) {
    const [r, g, b] = hex2rgb(f.color), o = f.id * 6;
    colorTab[o] = r; colorTab[o + 1] = g; colorTab[o + 2] = b;
    colorTab[o + 3] = r * .45; colorTab[o + 4] = g * .45; colorTab[o + 5] = b * .45;
  }
}

/* ---------------- Отрисовка территорий ---------------- */
function renderTerr(x0, y0, x1, y1) {
  x0 = clamp(x0 | 0, 0, TW); y0 = clamp(y0 | 0, 0, TH); x1 = clamp(Math.ceil(x1), 0, TW); y1 = clamp(Math.ceil(y1), 0, TH);
  if (x1 <= x0 || y1 <= y0) return;
  const d = tImg.data;
  for (let y = y0; y < y1; y++) {
    let i = y * TW + x0;
    for (let x = x0; x < x1; x++, i++) {
      const p = i * 4, o = owner[i];
      if (!o || !vis[i]) { d[p + 3] = 0; continue; }
      let n, border = false;
      if (x > 0      && land[i - 1]  && (n = owner[i - 1])  !== o && n < o) border = true;
      else if (x < TW - 1 && land[i + 1]  && (n = owner[i + 1])  !== o && n < o) border = true;
      else if (y > 0      && land[i - TW] && (n = owner[i - TW]) !== o && n < o) border = true;
      else if (y < TH - 1 && land[i + TW] && (n = owner[i + TW]) !== o && n < o) border = true;
      const c = o * 6 + (border ? 3 : 0);
      d[p] = colorTab[c]; d[p + 1] = colorTab[c + 1]; d[p + 2] = colorTab[c + 2]; d[p + 3] = border ? 235 : FILL_A;
    }
  }
  tctx.putImageData(tImg, 0, 0, x0, y0, x1 - x0, y1 - y0);
}
const renderAll = () => renderTerr(0, 0, TW, TH);

let dirty = null, rafT = 0;
function markDirty(x0, y0, x1, y1) {
  if (!dirty) dirty = [x0, y0, x1, y1];
  else { dirty[0] = Math.min(dirty[0], x0); dirty[1] = Math.min(dirty[1], y0); dirty[2] = Math.max(dirty[2], x1); dirty[3] = Math.max(dirty[3], y1); }
  if (!rafT) rafT = requestAnimationFrame(() => { rafT = 0; const r = dirty; dirty = null; if (r) renderTerr(r[0] - 2, r[1] - 2, r[2] + 2, r[3] + 2); });
}

/* ---------------- Операции с территорией ---------------- */
const onlyFree = () => $('onlyfree').checked;

function paintDisk(cx, cy, r, val) {
  const x0 = Math.max(0, Math.floor(cx - r)), x1 = Math.min(TW - 1, Math.ceil(cx + r));
  const y0 = Math.max(0, Math.floor(cy - r)), y1 = Math.min(TH - 1, Math.ceil(cy + r));
  const r2 = r * r, free = val && onlyFree();
  for (let y = y0; y <= y1; y++) {
    const dy = y - cy;
    for (let x = x0; x <= x1; x++) {
      const dx = x - cx; if (dx * dx + dy * dy > r2) continue;
      const i = y * TW + x;
      if (!land[i]) continue;
      if (free && owner[i] && owner[i] !== val) continue;
      owner[i] = val;
    }
  }
  markDirty(x0, y0, x1 + 1, y1 + 1);
}

function paintLine(a, b, val) {
  const r = Math.max(.7, (+$('bsize').value / 2) / (view.s * TS));
  const ax = a[0] / TS, ay = a[1] / TS, bx = b[0] / TS, by = b[1] / TS;
  const dist = Math.hypot(bx - ax, by - ay), steps = Math.max(1, Math.ceil(dist / (r * .4)));
  for (let k = 1; k <= steps; k++) paintDisk(ax + (bx - ax) * k / steps, ay + (by - ay) * k / steps, r, val);
}

function fillPolygon(pts, val) {
  if (pts.length < 3) return 0;
  const tp = pts.map(p => [p[0] / TS, p[1] / TS]);
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const [x, y] of tp) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
  x0 = clamp(Math.floor(x0), 0, TW - 1); y0 = clamp(Math.floor(y0), 0, TH - 1);
  x1 = clamp(Math.ceil(x1), 0, TW - 1);  y1 = clamp(Math.ceil(y1), 0, TH - 1);
  const bw = x1 - x0 + 1, bh = y1 - y0 + 1;
  const c = document.createElement('canvas'); c.width = bw; c.height = bh;
  const g = c.getContext('2d');
  g.beginPath(); tp.forEach(([x, y], k) => k ? g.lineTo(x - x0, y - y0) : g.moveTo(x - x0, y - y0)); g.closePath();
  g.fillStyle = '#000'; g.fill();
  const a = g.getImageData(0, 0, bw, bh).data, free = val && onlyFree();
  let n = 0;
  for (let y = 0; y < bh; y++) for (let x = 0; x < bw; x++) {
    if (a[(y * bw + x) * 4 + 3] < 128) continue;
    const i = (y + y0) * TW + x + x0;
    if (!land[i] || (free && owner[i] && owner[i] !== val) || owner[i] === val) continue;
    owner[i] = val; n++;
  }
  markDirty(x0, y0, x1 + 1, y1 + 1);
  return n;
}

let fillStack = null;
function floodFill(wx, wy, val) {
  const sx = Math.floor(wx / TS), sy = Math.floor(wy / TS);
  if (sx < 0 || sy < 0 || sx >= TW || sy >= TH) return 0;
  const s = sy * TW + sx;
  if (!land[s]) return 0;
  const target = owner[s];
  if (target === val) return 0;
  if (!fillStack) fillStack = new Int32Array(TW * TH);
  let sp = 0, n = 0, x0 = sx, y0 = sy, x1 = sx, y1 = sy;
  fillStack[sp++] = s; owner[s] = val;
  while (sp) {
    const i = fillStack[--sp], x = i % TW, y = (i - x) / TW; n++;
    if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
    if (x > 0      && land[i - 1]  && owner[i - 1]  === target) { owner[i - 1]  = val; fillStack[sp++] = i - 1; }
    if (x < TW - 1 && land[i + 1]  && owner[i + 1]  === target) { owner[i + 1]  = val; fillStack[sp++] = i + 1; }
    if (y > 0      && land[i - TW] && owner[i - TW] === target) { owner[i - TW] = val; fillStack[sp++] = i - TW; }
    if (y < TH - 1 && land[i + TW] && owner[i + TW] === target) { owner[i + TW] = val; fillStack[sp++] = i + TW; }
  }
  markDirty(x0, y0, x1 + 1, y1 + 1);
  return n;
}

/* ---------------- Сжатие, отмена, сохранение ---------------- */
function rleEncode(a) {
  const out = []; let v = a[0], c = 1;
  for (let i = 1; i < a.length; i++) { if (a[i] === v) c++; else { out.push(v, c); v = a[i]; c = 1; } }
  out.push(v, c); return out;
}
function rleDecode(r, a) {
  let p = 0;
  for (let k = 0; k < r.length; k += 2) { a.fill(r[k], p, p + r[k + 1]); p += r[k + 1]; }
}

const undoStack = [];
function snapshot() { return { t: Int32Array.from(rleEncode(owner)), d: JSON.stringify({ factions, points, roads, activeF }) }; }
function pushUndo() { undoStack.push(snapshot()); if (undoStack.length > 40) undoStack.shift(); }
function undo() {
  const s = undoStack.pop(); if (!s) return;
  rleDecode(s.t, owner);
  ({ factions, points, roads, activeF } = JSON.parse(s.d));
  roadDraft = null; hidePop();
  afterBigChange();
}

function serialize() { return { v: 1, tw: TW, th: TH, factions, points, roads, terr: rleEncode(owner) }; }
function deserialize(o) {
  factions = Array.isArray(o.factions) ? o.factions : DEFAULT_FACTIONS.map(f => ({ ...f }));
  points = Array.isArray(o.points) ? o.points : [];
  roads = Array.isArray(o.roads) ? o.roads : [];
  owner.fill(0);
  if (o.terr && o.tw === TW && o.th === TH) rleDecode(o.terr, owner);
  activeF = factions[0] ? factions[0].id : 0;
}
let saveT = 0, savePending = false;
function saveNow() {
  clearTimeout(saveT); if (!owner) return; savePending = false;
  try { localStorage.setItem(STORE_KEY, JSON.stringify(serialize())); } catch (e) { console.warn('Не удалось сохранить', e); }
}
function scheduleSave() { savePending = true; clearTimeout(saveT); saveT = setTimeout(saveNow, 250); }
window.addEventListener('pagehide', () => { if (savePending) saveNow(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && savePending) saveNow(); });

function afterBigChange() { updateColors(); renderAll(); buildLegend(); updateStats(); requestDraw(); scheduleSave(); }
function afterTerrChange() { updateStats(); scheduleSave(); }

/* ---------------- Статистика ---------------- */
let statsT = 0;
function updateStats() {
  clearTimeout(statsT);
  statsT = setTimeout(() => {
    const cnt = new Uint32Array(256);
    for (let i = 0; i < owner.length; i++) if (vis[i]) cnt[owner[i]]++;
    document.querySelectorAll('.frow').forEach(r => {
      const id = +r.dataset.id;
      r.querySelector('.fpct').textContent = (cnt[id] / landTotal * 100).toFixed(1) + '%';
    });
  }, 150);
}

/* ---------------- Значки точек ---------------- */
function drawIcon(g, type, x, y, r) {
  const t = ptDef(type);
  g.beginPath();
  if (t.shape === 'star') {
    for (let k = 0; k < 10; k++) {
      const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r * .55 : r * 1.35;

/* ---------------- Слой точек и дорог ---------------- */

  octx.strokeStyle = '#e9d9a6'; octx.lineWidth = 2.5; octx.stroke();

function drawOverlay() {
  drawQ = false;
  const dpr = window.devicePixelRatio || 1;
  octx.setTransform(dpr, 0, 0, dpr, 0, 0);
  octx.clearRect(0, 0, ov.width, ov.height);
  octx.lineCap = octx.lineJoin = 'round';

  for (const r of roads) { const p = roadScreenPath(r); if (p) strokeRoad(p); }

  if (roadDraft) {
    const a = pById(roadDraft.from);
    if (a) {
      const pts = [[a.x, a.y], ...roadDraft.via].map(p => toScreen(p[0], p[1]));
      strokeRoad(pts);
      const last = pts[pts.length - 1];
      octx.setLineDash([6, 6]); octx.strokeStyle = '#e9d9a6'; octx.lineWidth = 2;
      octx.beginPath(); octx.moveTo(last[0], last[1]); octx.lineTo(mouse.x, mouse.y); octx.stroke(); octx.setLineDash([]);
      const [sx, sy] = toScreen(a.x, a.y);
      octx.beginPath(); octx.arc(sx, sy, 14, 0, Math.PI * 2); octx.strokeStyle = '#8fd0d8'; octx.lineWidth = 2; octx.stroke();
    }
  }

  octx.textAlign = 'center'; octx.textBaseline = 'top';

    const [x, y] = toScreen(p.x, p.y);
    if (x < -60 || y < -60 || x > innerWidth + 60 || y > innerHeight + 60) continue;
    drawIcon(octx, p.type, x, y, p.type === 'capital' ? 8 : 6.5);
    if (p.name) {
      octx.font = (p.type === 'capital' ? '700 13px' : '600 12px') + ' "Segoe UI", Roboto, Arial, sans-serif';
      octx.lineWidth = 3.5; octx.strokeStyle = 'rgba(10,12,14,.9)'; octx.strokeText(p.name, x, y + 11);

}

    h.setPointerCapture(e.pointerId);
    const mv = ev => { win.style.left = clamp(ev.clientX - ox, 0, innerWidth - 60) + 'px'; win.style.top = clamp(ev.clientY - oy, 0, innerHeight - 30) + 'px'; win.style.right = 'auto'; };
    const up = () => { h.removeEventListener('pointermove', mv); h.removeEventListener('pointerup', up); };
    h.addEventListener('pointermove', mv); h.addEventListener('pointerup', up);
  });
});

/* ---------------- Загрузка ---------------- */
function loadImage(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }

(async function init() {
  resizeOverlay();
  try {
    const [, maskImg] = await Promise.all([img.decode ? img.decode() : loadImage(img.src), loadImage('land.png')]);
    W = img.naturalWidth; H = img.naturalHeight;
    TW = maskImg.naturalWidth; TH = maskImg.naturalHeight;
    const c = document.createElement('canvas'); c.width = TW; c.height = TH;
    const g = c.getContext('2d'); g.drawImage(maskImg, 0, 0);
    const md = g.getImageData(0, 0, TW, TH).data;
    land = new Uint8Array(TW * TH); vis = new Uint8Array(TW * TH); owner = new Uint8Array(TW * TH);
    for (let i = 0; i < TW * TH; i++) { const v = md[i * 4]; land[i] = v > 64 ? 1 : 0; vis[i] = v > 200 ? 1 : 0; landTotal += vis[i]; }

    tcan.width = TW; tcan.height = TH; tcan.style.width = TW * TS + 'px'; tcan.style.height = TH * TS + 'px';
    tImg = tctx.createImageData(TW, TH);

    let data = null;
    try { data = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (e) {}
    if (!data) { try { const r = await fetch('map-data.json', { cache: 'no-store' }); if (r.ok) data = await r.json(); } catch (e) {} }
    deserialize(data || {});
    $('loading').remove();
    fit(); setTool('pan'); afterBigChange();
  } catch (err) {
    $('loading').textContent = 'Не удалось загрузить карту: ' + err;
  }
})();

/* ---------------- Музыка с YouTube ---------------- */
let player, ytReady = false, entered = false;
const muteBtn = $('mute'), errBox = $('dock-err');
window.onYouTubeIframeAPIReady = function () {
  player = new YT.Player('yt', {
    videoId: VIDEO_ID, width: 200, height: 200,
    playerVars: { start: START_SEC, playsinline: 1, rel: 0, controls: 1 },
    events: {
      onReady: () => { ytReady = true; player.setVolume(VOLUME); if (entered) playMusic(); },
      onStateChange: e => { if (e.data === YT.PlayerState.ENDED) { player.seekTo(START_SEC, true); player.playVideo(); } },
      onError: e => {
        errBox.style.display = 'block';
        errBox.textContent = (e.data === 101 || e.data === 150) ? 'Автор ролика запретил встраивание — нужен другой ролик.' : 'Не удалось загрузить видео (код ' + e.data + ').';
      }
    }
  });
};
{
  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  tag.onerror = () => { errBox.style.display = 'block'; errBox.textContent = 'YouTube недоступен — музыка не загрузилась.'; };
  document.head.appendChild(tag);
}
function playMusic() { player.unMute(); player.playVideo(); muteBtn.textContent = '🔊'; }
$('enter').addEventListener('click', () => { entered = true; $('gate').classList.add('hide'); if (ytReady) playMusic(); });
muteBtn.addEventListener('click', () => {
  if (!ytReady) return;
  if (player.isMuted()) { player.unMute(); muteBtn.textContent = '🔊'; } else { player.mute(); muteBtn.textContent = '🔇'; }
});
